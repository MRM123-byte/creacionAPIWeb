<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Explorador de contenido aleatorio</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/styles.css" rel="stylesheet">
</head>
<body>
  <header class="text-center py-4">
    <h1 class="h2 mb-1">Explorador de contenido aleatorio</h1>
    <p class="text-muted mb-0">Citas, perros, gatos y datos curiosos desde cuatro APIs públicas</p>
  </header>

  <main class="container pb-5">
    <div class="row g-4">

      <!-- Citas -->
      <section class="col-12 col-md-6" aria-labelledby="titulo-cita">
        <article class="card h-100 shadow-sm">
          <div class="card-header fw-semibold" id="titulo-cita">Citas y autores</div>
          <div class="card-body d-flex flex-column">
            <div class="content-area" id="cita-contenido" aria-live="polite">
              <p class="status-message">Cargando…</p>
            </div>
            <button type="button" class="btn btn-primary mt-auto" id="cita-boton">Obtener otra cita</button>
          </div>
        </article>
      </section>

      <!-- Perros -->
      <section class="col-12 col-md-6" aria-labelledby="titulo-perro">
        <article class="card h-100 shadow-sm">
          <div class="card-header fw-semibold" id="titulo-perro">Perros</div>
          <div class="card-body d-flex flex-column">
            <div class="content-area" id="perro-contenido" aria-live="polite">
              <p class="status-message">Cargando…</p>
            </div>
            <button type="button" class="btn btn-primary mt-auto" id="perro-boton">Mostrar otro perro</button>
          </div>
        </article>
      </section>

      <!-- Gatos -->
      <section class="col-12 col-md-6" aria-labelledby="titulo-gato">
        <article class="card h-100 shadow-sm">
          <div class="card-header fw-semibold" id="titulo-gato">Gatos</div>
          <div class="card-body d-flex flex-column">
            <div class="content-area" id="gato-contenido" aria-live="polite">
              <p class="status-message">Cargando…</p>
            </div>
            <button type="button" class="btn btn-primary mt-auto" id="gato-boton">Mostrar otro gato</button>
          </div>
        </article>
      </section>

      <!-- Datos curiosos -->
      <section class="col-12 col-md-6" aria-labelledby="titulo-dato">
        <article class="card h-100 shadow-sm">
          <div class="card-header fw-semibold" id="titulo-dato">Datos curiosos</div>
          <div class="card-body d-flex flex-column">
            <div class="content-area" id="dato-contenido" aria-live="polite">
              <p class="status-message">Cargando…</p>
            </div>
            <button type="button" class="btn btn-primary mt-auto" id="dato-boton">Mostrar otro dato</button>
          </div>
        </article>
      </section>

    </div>
  </main>

  <script src="js/app.js"></script>
</body>
</html>
